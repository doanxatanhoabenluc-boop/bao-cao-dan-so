<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý 11 Biểu mẫu Dữ liệu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @media (max-width: 767.98px) {
            html, body { max-width: 100%; overflow-x: hidden; }
            .navbar { padding: 10px 12px !important; }
            .navbar .container-fluid { gap: 8px; flex-wrap: wrap; }
            .navbar-brand { max-width: calc(100% - 54px); white-space: normal; font-size: .98rem !important; line-height: 1.3; }
            .navbar-toggler { padding: .35rem .5rem; }
            .navbar-collapse { width: 100%; flex-basis: 100%; }
            .navbar-collapse .d-flex { width: 100%; }
            .navbar-collapse .btn { width: 100%; min-height: 40px; text-align: left; }
            .container-fluid.my-4 { margin-top: 12px !important; padding-left: 8px !important; padding-right: 8px !important; }
            .card { border-radius: 12px !important; overflow: hidden; }
            .card-header { padding: 12px !important; }
            .card-header h5 { font-size: .98rem !important; line-height: 1.35; }
            .card-header > .d-flex { width: 100% !important; align-items: stretch !important; flex-direction: column; gap: 6px !important; }
            .card-header > .d-flex label { white-space: normal !important; }
            #selectManagedTable { width: 100%; min-height: 42px; font-size: 16px; }
            .card-body { padding: 10px !important; }
            #adminSearchInput { min-width: 0; font-size: 16px; }
            .card-body > .row.mb-3 { margin-left: 0; margin-right: 0; }
            .card-body > .row.mb-3 > [class*="col-"] { padding-left: 0; padding-right: 0; }
            .card-body .btn { min-height: 38px; }
            .card-body > .d-flex.flex-wrap { align-items: stretch !important; }
            .table-responsive { width: 100%; min-height: 0; max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; }
            .table-responsive table { min-width: 850px; width: max-content; max-width: none; font-size: .78rem; }
            .table-responsive th, .table-responsive td { padding: .45rem .5rem !important; white-space: nowrap; vertical-align: middle; }
            #adminPaginationContainer { flex-wrap: wrap; gap: 5px; }
            #adminPaginationContainer .pagination { flex-wrap: wrap; justify-content: center; }
            .modal-dialog { width: calc(100% - 16px); max-width: none; margin: 8px auto; }
            .modal-content { border-radius: 12px; }
            .modal-header, .modal-footer { padding: 12px; }
            .modal-title { font-size: 1rem; line-height: 1.35; }
            .modal-body { padding: 12px; max-height: calc(100dvh - 150px); overflow-y: auto; }
            #editDataFieldsContainer { row-gap: 8px; }
            #editDataFieldsContainer > [class*="col-"] { width: 100%; }
            .modal-footer { display: flex; flex-wrap: wrap; gap: 8px; }
            .modal-footer .btn { flex: 1 1 130px; min-height: 42px; margin: 0 !important; }
        }
        @media (max-width: 380px) {
            .navbar-brand { font-size: .9rem !important; }
            .card-header h5 { font-size: .9rem !important; }
            .table-responsive table { min-width: 780px; }
        }
    </style>
    <link rel="stylesheet" href="mobile-responsive.css?v=20261110-v3">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3 shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold fs-6 fs-md-5" href="#">
                <i class="fa-solid fa-table-list text-warning me-1"></i> Quản lý Biểu mẫu Dữ liệu
            </a>
            
            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#adminNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-end mt-2 mt-lg-0" id="adminNavbar">
                <div class="d-flex flex-column flex-lg-row gap-2">
                    <a href="admin.html" class="btn btn-outline-light btn-sm">
                        <i class="fa-solid fa-arrow-left me-1"></i> Quay lại Admin
                    </a>
                    <a href="index.html" class="btn btn-outline-light btn-sm">
                        <i class="fa-solid fa-house me-1"></i> Về trang nhập liệu
                    </a>
                    <button onclick="logout()" class="btn btn-danger btn-sm">
                        <i class="fa-solid fa-right-from-bracket me-1"></i> Đăng xuất
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid my-4 px-3 px-md-4">
        <div class="card shadow-sm mb-4 border-0">
            <div class="card-header bg-success text-white d-flex justify-content-between align-items-center flex-wrap gap-2 py-3">
                <h5 class="mb-0 fs-6 fs-md-5"><i class="fa-solid fa-database me-1"></i> Xem & Chỉnh sửa Dữ liệu 11 Biểu mẫu</h5>
                <div class="d-flex align-items-center gap-2 w-100 w-md-auto">
                    <label class="text-white fw-semibold mb-0 small text-nowrap">Chọn bảng:</label>
                    <select id="selectManagedTable" class="form-select form-select-sm" onchange="loadTableDataAdmin(1)">
                        <option value="table_1">1. Trẻ sinh ra</option>
                        <option value="table_2">2. SL sơ sinh</option>
                        <option value="table_3">3. Người chết</option>
                        <option value="table_4">4. Người chuyển đến</option>
                        <option value="table_5">5. Người chuyển đi</option>
                        <option value="table_6">6. Thay đổi thông tin</option>
                        <option value="table_7">7. Vợ chồng mới dùng BPTT</option>
                        <option value="table_8">8. Vợ chồng thôi dùng BPTT</option>
                        <option value="table_9">9. Thai sản</option>
                        <option value="table_10">10. Sàng lọc trước sinh</option>
                        <option value="table_11">11. Người cao tuổi khám SK</option>
                    </select>
                </div>
            </div>
            <div class="card-body p-2 p-md-3">
                <!-- Thanh tìm kiếm nhanh -->
                <div class="row mb-3">
                    <div class="col-md-6 col-lg-4">
                        <div class="input-group input-group-sm">
                            <input type="text" id="adminSearchInput" class="form-control" placeholder="Tìm kiếm (họ tên, số hộ, thẻ BHYT)..." oninput="loadTableDataAdmin(1)">
                            <button class="btn btn-outline-secondary" type="button" onclick="loadTableDataAdmin(1)">
                                <i class="fa-solid fa-search"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
                    <button type="button" class="btn btn-danger btn-sm" onclick="deleteSelectedRecords()"><i class="fa-solid fa-trash me-1"></i>Xóa các dòng đã chọn</button>
                    <span id="selectedRowsCount" class="text-muted small">Đã chọn: 0 dòng</span>
                </div>

                <!-- Bảng hiển thị dữ liệu -->
                <div class="table-responsive">
                    <table class="table table-bordered table-striped table-hover align-middle small">
                        <thead class="table-secondary text-center sticky-top" id="adminTableHeader"></thead>
                        <tbody id="adminTableBody">
                            <tr><td class="text-center py-3">Vui lòng chọn bảng dữ liệu...</td></tr>
                        </tbody>
                    </table>
                </div>

                <!-- Khu vực phân trang -->
                <div id="adminPaginationContainer" class="d-flex justify-content-center mt-3"></div>
            </div>
        </div>
    </div>

    <!-- Modal Sửa Dữ Liệu Biểu Mẫu -->
    <div class="modal fade" id="editDataModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <form id="editDataForm" onsubmit="saveRecordData(event)">
                    <div class="modal-header bg-success text-white">
                        <h5 class="modal-title"><i class="fa-solid fa-pen-to-square"></i> Chỉnh sửa thông tin</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="editRecordId">
                        <div class="row" id="editDataFieldsContainer"></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button type="submit" class="btn btn-success">Cập nhật thay đổi</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="quan-ly-bieu-mau.js"></script>
    <script src="bhyt-search.js"></script>
    <script>
        // Gọi hàm tải dữ liệu ngay khi vào trang
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof loadTableDataAdmin === 'function') {
                loadTableDataAdmin(1);
            }
        });
    </script>
    <script src="mobile-ui.js?v=20261110-v3"></script>
</body>
</html>
